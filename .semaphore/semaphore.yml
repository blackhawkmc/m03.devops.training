version: v1.0
name: Code Signing Pipeline

agent:
  machine:
    type: f1-standard-4
    os_image: ubuntu2404

blocks:
  - name: Sign
    dependencies: []
    task:
      secrets:
        - name: DOCKER_FILIP
      jobs:
        - name: Sign artifact
          commands:
            - checkout
            - gpg --import /home/semaphore/public.key
            - gpg --import /home/semaphore/private.key
            - gpg --output artifact.txt.sig --detach-sign artifact.txt
            - artifact push workflow artifact.txt.sig

  - name: Verify
    dependencies: [Sign]
    task:
      secrets:
        - name: DOCKER_FILIP
      jobs:
        - name: Verify signature
          commands:
            - checkout
            - gpg --import /home/semaphore/public.key
            - artifact pull workflow artifact.txt.sig
            - gpg --verify artifact.txt.sig artifact.txt
